  "abstract": "Kim et al. reported halofantrine-associated photoreceptor protection in three inherited retinal degeneration models and partial similarity in their transcriptomic responses. We examined the computational evidence accompanying that result, using the deposited differential-expression tables and normalized expression matrices for human CEP290-LCA retinal organoids, P23H rats and rd10 mice. Nine reconstructions of the gene-selection and mapping procedure did not reproduce the seven regions of Figure S7A and its sole three-model intersection. The deposited rd10 Itpr3 result had nominal p = 0.119, leaving unresolved which test supports the source statement of significance in all three models. These are gaps in recovering the specified analyses, not evidence that no valid implementation exists. Separately, multiple-testing control, one-to-one orthologue comparisons, leave-one-out analyses, overlap randomization and ranked pathway enrichment characterized the sensitivity of the transcriptomic interpretation. Human–rd10 effect concordance remained positive across all tested single-sample deletions; correlations involving P23H were weaker and crossed zero. Oxidative phosphorylation had positive enrichment scores in all three models, although only P23H met the chosen FDR threshold. The reanalysis identifies the source details needed to reproduce the two transcriptomic figures and provides quantitative robustness results without reassessing the reported phenotypic rescue.",
